<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video İzle</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: black; /* Arka plan rengi */
            display: flex;
            flex-direction: column; /* Öğeleri alt alta dizer */
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif; /* Yazı tipi */
        }

        /* Foto Ayarları */
        img {
    width: 90%;
    max-width: 800px;
    height: auto;
    border-radius: 10px;
    box-shadow: 0 0 20px rgba(255,255,255,0.1);
}

        }

        /* Üst Yazı Stili */
        h1 {
            color: white;
            margin-bottom: 20px; /* Video ile arasındaki boşluk */
            text-align: center;
            font-size: 24px;
        }

        /* Alt Yazı Stili */
        p {
            color: #cccccc; /* Hafif gri renk */
            margin-top: 15px; /* Video ile arasındaki boşluk */
            text-align: center;
            font-size: 16px;
            max-width: 90%;
        }
    </style>
</head>
