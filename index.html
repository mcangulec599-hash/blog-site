<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mehmet Cangüleç | eğlencme yeri</title>
  <link rel="shortcut icon" href="logo.png" type="image/png" />
  <style>
    html { scroll-behavior: smooth; }
    body { font-family: 'Segoe UI', sans-serif; margin: 0; background-color: #fafafa; color: #333; }

<video width="100%" controls>
  <source src="Bilal.mp4" type="video/mp4">
  Tarayıcınız bu videoyu desteklemiyor.
</video>

    
    header {
      text-align: center;
      background-color: white;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      padding: 20px;
    }

    header img { height: 80px; width: auto; }
    header h1 { font-size: 24px; margin-top: 8px; }

    nav {
      background-color: #1a1a1a;
      color: white;
      text-align: center;
      padding: 12px 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 12px;
      font-weight: bold;
      transition: color 0.3s;
      font-size: 16px;
    }

    nav a:hover { color: #aaa; }

    section {
      max-width: 900px;
      margin: 30px auto;
      padding: 20px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .about {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
    }

    .about img {
      width: 160px;
      border-radius: 15px;
      margin-right: 20px;
    }

    .about p { flex: 1; min-width: 250px; }

    form {
      display: flex;
      flex-direction: column;
      margin-top: 15px;
    }

    label { margin-top: 10px; font-weight: bold; }
    input, textarea {
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 5px;
      margin-top: 5px;
      font-size: 15px;
    }

    button {
      margin-top: 15px;
      padding: 12px;
      background-color: #1a1a1a;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 17px;
      transition: background-color 0.3s;
    }

    button:hover { background-color: #333; }

    article {
      margin-bottom: 25px;
      border-bottom: 1px solid #eee;
      padding-bottom: 15px;
    }

    article h3 { font-size: 18px; margin-bottom: 8px; }
    article p { font-size: 15px; line-height: 1.5; white-space: pre-wrap; }
    small { color: #777; display: block; margin-top: 8px; }

    .admin-area {
      max-width: 900px;
      margin: 20px auto;
      padding: 12px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .admin-area input { max-width: 320px; flex: 1; }
    .admin-area .status { margin-left: auto; color: #555; font-size: 14px; }

    footer {
      text-align: center;
      padding: 25px;
      background-color: #1a1a1a;
      color: white;
      margin-top: 40px;
      font-size: 14px;
    }

    /* 📱 Mobil uyum */
    @media (max-width: 768px) {
      header img { height: 60px; }
      header h1 { font-size: 20px; }
      nav a { margin: 0 8px; font-size: 15px; }
      section { margin: 15px; padding: 15px; }
      input, textarea, button { font-size: 16px; }
      .about { flex-direction: column; text-align: center; }
      .about img { margin: 0 auto 15px; }
      .admin-area { flex-direction: column; align-items: stretch; }
      .admin-area .status { margin-left: 0; }
    }
  </style>
</head>
<body>

  <header>
    <img src="logo.png" alt="MC Logo" />
    <h1>Mehmet Cangüleç | eğlenme yeri</h1>
  </header>

  <nav>
    <a href="#hakkimda">Hakkımda</a>
    <a href="#yazilar">Yazılar</a>
    <a href="#yeniYazi">Yazı Ekle</a>
  </nav>

  <section id="hakkimda">
    <h2>Hakkımda</h2>
    <div class="about">
      <img src="profil.jpg" alt="Profil Fotoğrafı" />
      <p>dostlarımla beraber yazılar paylaşıyoruz</p>
    </div>
  </section>

  <!-- Admin / Login bölümü (üstte görünecek) -->
  <div class="admin-area" id="adminArea">
    <input type="email" id="adminEmail" placeholder="E-posta (admin)" value="mcangulec599@gmail.com" />
    <input type="password" id="adminPassword" placeholder="Şifre (gizli)" />
    <button id="loginBtn">Giriş Yap</button>
    <button id="logoutBtn" style="display:none;">Çıkış Yap</button>
    <div class="status" id="adminStatus">Ziyaretçi</div>
  </div>

  <section id="yazilar">
    <h2>Yazılar</h2>
    <div id="yaziListesi"></div>
  </section>

  <section id="yeniYazi">
    <h2>Yeni Yazı Ekle</h2>
    <form id="yaziForm">
      <label>Yazar Adı:</label>
      <input type="text" id="yazar" required />
      <label>Yazı İçeriği:</label>
      <textarea id="icerik" rows="4" required></textarea>
      <button type="submit">Yazıyı Yayınla</button>
    </form>
  </section>

  <footer>
    <p>© 2025 Mehmet Cangüleç. Tüm hakları saklıdır.</p>
  </footer>

  <!-- Firebase ve uygulama kodu -->
  <script type="module">
    // Firebase SDK modülleri
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import {
      getFirestore, collection, addDoc, getDocs, deleteDoc, doc, serverTimestamp, query, orderBy
    } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
    import {
      getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
    } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

    // ---------- Firebase config (senin proje bilgilerin) ----------
    const firebaseConfig = {
      apiKey: "AIzaSyBeX_35S6qrW_Xq34idVEOO_fAX9JN-Ya8",
      authDomain: "mehmet-blog-e6b69.firebaseapp.com",
      projectId: "mehmet-blog-e6b69",
      storageBucket: "mehmet-blog-e6b69.firebasestorage.app",
      messagingSenderId: "257344928109",
      appId: "1:257344928109:web:0a0fb3e82412429cc0c264"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // DOM elemanları
    const yaziListesi = document.getElementById("yaziListesi");
    const form = document.getElementById("yaziForm");

    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const adminEmailInput = document.getElementById("adminEmail");
    const adminPasswordInput = document.getElementById("adminPassword");
    const adminStatus = document.getElementById("adminStatus");

    // ---------- Giriş / Çıkış işlemleri ----------
    loginBtn.addEventListener("click", async () => {
      const email = adminEmailInput.value.trim();
      const password = adminPasswordInput.value;
      if (!email || !password) {
        alert("Email ve şifre gir.");
        return;
      }
      try {
        await signInWithEmailAndPassword(auth, email, password);
        // onAuthStateChanged callback çalışacak ve UI güncellenecek
      } catch (err) {
        alert("Giriş başarısız: " + (err.message || err));
      }
    });

    logoutBtn.addEventListener("click", async () => {
      await signOut(auth);
      alert("Çıkış yapıldı.");
    });

    // ---------- Yazı ekleme ----------
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const yazar = document.getElementById("yazar").value.trim();
      const icerik = document.getElementById("icerik").value.trim();
      if (!yazar || !icerik) {
        alert("Yazar ve içerik gerekli.");
        return;
      }
      try {
        await addDoc(collection(db, "yazilar"), {
          yazar,
          icerik,
          tarih: serverTimestamp()
        });
        form.reset();
        alert("Yazı başarıyla yayınlandı!");
        // yenilemek yerine tekrar çek
        const user = auth.currentUser;
        await yazilariGetir(user);
      } catch (err) {
        alert("Yazı eklenirken hata: " + (err.message || err));
      }
    });

    // ---------- Yazıları getir ve DOM'a ekle ----------
    async function yazilariGetir(user) {
      yaziListesi.innerHTML = "Yükleniyor...";
      try {
        const q = query(collection(db, "yazilar"), orderBy("tarih", "desc"));
        const snapshot = await getDocs(q);
        yaziListesi.innerHTML = "";
        if (snapshot.empty) {
          yaziListesi.innerHTML = "<p>Henüz yazı yok.</p>";
          return;
        }

        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          const id = docSnap.id;
          const tarih = data.tarih?.toDate
            ? data.tarih.toDate().toLocaleString("tr-TR")
            : "Tarih yok";

          const article = document.createElement("article");

          const h3 = document.createElement("h3");
          h3.textContent = data.yazar || "Anonim";
          article.appendChild(h3);

          const p = document.createElement("p");
          p.textContent = data.icerik || "";
          article.appendChild(p);

          const small = document.createElement("small");
          small.textContent = "Yayın tarihi: " + tarih;
          article.appendChild(small);

          // Sadece admin (sen) için silme butonu göster
          if (user && user.email === "mcangulec599@gmail.com") {
            const delBtn = document.createElement("button");
            delBtn.textContent = "🗑️ Sil";
            delBtn.style.marginTop = "8px";
            delBtn.addEventListener("click", async () => {
              const ok = confirm("Bu yazıyı gerçekten silmek istiyor musun? Bu işlem geri alınamaz.");
              if (!ok) return;
              try {
                await deleteDoc(doc(db, "yazilar", id));
                alert("Yazı silindi.");
                await yazilariGetir(user);
              } catch (err) {
                alert("Silme sırasında hata: " + (err.message || err));
              }
            });
            article.appendChild(delBtn);
          }

          yaziListesi.appendChild(article);
        });
      } catch (err) {
        yaziListesi.innerHTML = "<p>Yazılar yüklenirken hata oldu.</p>";
        console.error(err);
      }
    }

    // ---------- Auth durumunu izle ----------
    onAuthStateChanged(auth, (user) => {
      if (user) {
        adminStatus.textContent = "Giriş: " + (user.email || "admin");
        loginBtn.style.display = "none";
        logoutBtn.style.display = "inline-block";
        // girişli kullanıcı bilgilerini gizle (isteğe bağlı)
        adminEmailInput.style.display = "none";
        adminPasswordInput.style.display = "none";
        yazilariGetir(user);
      } else {
        adminStatus.textContent = "Ziyaretçi";
        loginBtn.style.display = "inline-block";
        logoutBtn.style.display = "none";
        adminEmailInput.style.display = "inline-block";
        adminPasswordInput.style.display = "inline-block";
        yazilariGetir(null);
      }
    });

    // İlk yüklemede yazıları getir (anon)
    yazilariGetir(null);
  </script>
</body>
</html>
