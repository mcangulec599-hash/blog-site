<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video İzle</title>
    <style>
        /* Sayfa Ayarları: Arka plan siyah */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Video Ayarları */
        video {
            max-width: 100%;
            max-height: 100vh;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <video controls playsinline autoplay>
        <source src="Bilal.mp4" type="video/mp4">
        Tarayıcınız bu videoyu desteklemiyor.
    </video>

</body>
</html>
